<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ - Skeif Botsogo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        input, textarea { color: grey !important; }
    </style>
</head>
<body class="bg-zinc-900 text-white overflow-x-hidden">

    <header class="bg-black py-4 px-4 border-b-2 border-red-600">
        <nav class="flex flex-col md:flex-row justify-between items-center max-w-6xl mx-auto gap-4">
            <div class="flex items-center gap-3">
                <img src="logo.jpeg" alt="Logo" class="h-10 w-auto rounded">
                <div class="text-2xl md:text-3xl font-bold text-red-600 font-oswald uppercase">SKEIF BOTSOGO</div>
            </div>
            <ul class="flex flex-wrap justify-center gap-3 md:gap-6 font-semibold uppercase text-[11px] md:text-sm list-none mb-0 p-0">
                <li><a href="index.html" class="text-white no-underline">Home</a></li>
                <li><a href="menu.html" class="text-white no-underline">Menu</a></li>
                <li><a href="subscribe.html" class="text-white no-underline">Subscribe</a></li>
                <li><a href="faq.html" class="text-red-500 no-underline underline decoration-2">FAQ</a></li>
                <li><a href="contact.html" class="text-white no-underline">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="container py-10 px-4">
        <h2 class="text-center text-3xl md:text-5xl font-bold text-red-600 uppercase font-oswald mb-8">Frequently Asked Questions</h2>
        <div class="max-w-3xl mx-auto space-y-4">
            <div class="bg-zinc-800 p-5 rounded-lg border border-zinc-700 shadow-lg">
                <h3 class="text-lg font-bold text-red-500 mb-2">How does the subscription work?</h3>
                <p class="text-zinc-400 text-sm">Choose from our 5, 6, or 7-day monthly plans for daily meal deliveries.</p>
            </div>
            <div class="mt-12 bg-black p-6 rounded-xl border border-zinc-800 shadow-2xl">
                <h3 class="text-center text-2xl font-bold text-red-500 mb-4 font-oswald">HAVE ANOTHER QUESTION?</h3>
                <form id="questionForm">
                    <div class="mb-3">
                        <label class="form-label text-red-500 fw-bold">Email</label>
                        <input type="email" class="form-control bg-zinc-900 border-zinc-700 text-white" placeholder="your@email.com" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-red-500 fw-bold">Question</label>
                        <textarea class="form-control bg-zinc-900 border-zinc-700 text-white" rows="4" placeholder="Your question..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-danger w-full py-3 fw-bold uppercase">Submit Question</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
