<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Skeif Botsogo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-zinc-900 text-white">
    <header class="bg-black py-4 px-6 border-b-2 border-red-600">
        <nav class="flex justify-between items-center max-w-6xl mx-auto">
            <div class="flex items-center gap-4">
                <img src="logo.jpeg" alt="Logo" class="h-12 w-auto rounded">
                <div class="text-3xl font-bold text-red-600 font-oswald uppercase">SKEIF BOTSOGO</div>
            </div>
            <ul class="flex gap-6 font-semibold uppercase text-sm list-none mb-0">
                <li><a href="index.html" class="text-white no-underline hover:text-red-500">Home</a></li>
                <li><a href="menu.html" class="text-white no-underline hover:text-red-500">Menu</a></li>
                <li><a href="subscribe.html" class="text-white no-underline hover:text-red-500">Subscribe</a></li>
                <li><a href="faq.html" class="text-white no-underline hover:text-red-500">FAQ</a></li>
                <li><a href="contact.html" class="text-red-500 no-underline underline decoration-2">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="container py-5 max-w-2xl">
        <h2 class="text-center display-4 font-bold text-red-600 uppercase font-oswald mb-5">Get In Touch</h2>
        <form class="bg-zinc-800 p-6 rounded-lg border border-zinc-700">
            <div class="mb-3">
                <label class="form-label text-red-500 fw-bold">Name</label>
                <input type="text" class="form-control bg-zinc-900 border-zinc-700 text-white" placeholder="Realeboga Rathapo">
            </div>
            <div class="mb-3">
                <label class="form-label text-red-500 fw-bold">Email</label>
                <input type="email" class="form-control bg-zinc-900 border-zinc-700 text-white" placeholder="email@example.com">
            </div>
            <div class="mb-3">
                <label class="form-label text-red-500 fw-bold">Message</label>
                <textarea class="form-control bg-zinc-900 border-zinc-700 text-white" rows="4"></textarea>
            </div>
            <button type="submit" class="btn btn-danger w-full fw-bold uppercase">Send Message</button>
        </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
