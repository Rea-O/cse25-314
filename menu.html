<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Skeif Botsogo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-zinc-900 text-white">
    <header class="p-3 bg-black border-bottom border-danger">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2">
                <img src="logo.jpeg" alt="Logo" style="height: 40px;">
                <span class="h3 mb-0 text-danger fw-bold">SKEIF BOTSOGO</span>
            </div>
            <nav class="nav">
                <a class="nav-link text-white" href="index.html">Home</a>
                <a class="nav-link text-danger fw-bold" href="menu.html">Menu</a>
                <a class="nav-link text-white" href="subscribe.html">Subscribe</a>
                <a class="nav-link text-white" href="faq.html">FAQ</a>
                <a class="nav-link text-white" href="contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <main class="container py-5">
        <h2 class="text-center display-4 fw-bold text-danger mb-5">WEEKLY MENU</h2>
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card bg-dark text-white border-secondary h-100">
                    <img src="monday.jpg" class="card-img-top" alt="Monday">
                    <div class="card-body">
                        <h5 class="card-title text-danger">Monday</h5>
                        <p class="card-text">Pap, Seswaa and Morogo</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-dark text-white border-secondary h-100">
                    <img src="tuesday.jpg" class="card-img-top" alt="Tuesday">
                    <div class="card-body">
                        <h5 class="card-title text-danger">Tuesday</h5>
                        <p class="card-text">Rice, Chicken and Chakalaka</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-dark text-white border-secondary h-100">
                    <img src="friday.jpg" class="card-img-top" alt="Friday">
                    <div class="card-body">
                        <h5 class="card-title text-danger">Friday</h5>
                        <p class="card-text">Chicken Salad & Penne Pasta</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
