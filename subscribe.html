<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscribe - Skeif Botsogo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-zinc-900 text-white">
    <!-- Header stays the same as above -->
    <header class="bg-black py-4 px-6 border-b-2 border-red-600">
        <nav class="flex justify-between items-center max-w-6xl mx-auto">
            <div class="flex items-center gap-4">
                <img src="logo.jpeg" alt="Logo" class="h-12 w-auto rounded">
                <div class="text-3xl font-bold text-red-600 font-oswald uppercase">SKEIF BOTSOGO</div>
            </div>
            <ul class="flex gap-6 font-semibold uppercase text-sm list-none mb-0">
                <li><a href="index.html" class="text-white no-underline hover:text-red-500">Home</a></li>
                <li><a href="menu.html" class="text-white no-underline hover:text-red-500">Menu</a></li>
                <li><a href="subscribe.html" class="text-red-500 no-underline underline decoration-2">Subscribe</a></li>
                <li><a href="faq.html" class="text-white no-underline hover:text-red-500">FAQ</a></li>
                <li><a href="contact.html" class="text-white no-underline hover:text-red-500">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="container py-5">
        <h2 class="text-center display-4 font-bold text-red-600 uppercase font-oswald mb-5">Subscription Plans</h2>
        <div class="row g-4 mb-5">
            <div class="col-md-6">
                <div class="card bg-zinc-800 text-white border-zinc-700 p-4 text-center">
                    <h3 class="text-red-500 font-oswald uppercase">5-Day Plan</h3>
                    <p class="display-5">P500</p>
                    <p>Monday - Friday</p>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card bg-zinc-800 text-white border-red-600 p-4 text-center">
                    <h3 class="text-red-500 font-oswald uppercase">7-Day Plan</h3>
                    <p class="display-5">P600</p>
                    <p>Monday - Sunday</p>
                </div>
            </div>
        </div>
        <div class="max-w-xl mx-auto bg-black p-8 rounded-xl border border-zinc-800">
            <h4 class="text-center font-oswald uppercase mb-4">Registration</h4>
            <form class="space-y-4">
                <input type="text" class="form-control bg-zinc-900 border-zinc-700 text-white" placeholder="Student ID">
                <select class="form-select bg-zinc-900 border-zinc-700 text-white">
                    <option>Select Campus (BAC/UB/IDM)</option>
                </select>
                <button type="submit" class="btn btn-danger w-full fw-bold uppercase">Confirm Selection</button>
            </form>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
