<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscribe - Skeif Botsogo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght=700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        input, select, textarea { color: grey !important; }
        input:-webkit-autofill {
            -webkit-text-fill-color: grey !important;
            -webkit-box-shadow: 0 0 0px 1000px #18181b inset !important;
        }
    </style>
</head>
<body class="bg-zinc-900 text-white overflow-x-hidden">

    <header class="bg-black py-4 px-6 border-b-2 border-red-600">
        <nav class="flex justify-between items-center max-w-6xl mx-auto">
            <div class="flex items-center gap-4">
                <img src="logo.jpeg" alt="Logo" class="h-12 w-auto rounded">
                <div class="text-3xl font-bold text-red-600 font-oswald uppercase">SKEIF BOTSOGO</div>
            </div>
            <ul class="flex gap-6 font-semibold uppercase text-sm list-none mb-0">
                <li><a href="index.html" class="text-white no-underline hover:text-red-500">Home</a></li>
                <li><a href="menu.html" class="text-white no-underline hover:text-red-500">Menu</a></li>
                <li><a href="subscribe.html" class="text-red-500 no-underline underline decoration-2">Subscribe</a></li>
                <li><a href="faq.html" class="text-white no-underline hover:text-red-500">FAQ</a></li>
                <li><a href="contact.html" class="text-white no-underline hover:text-red-500">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="container py-10 px-4">
        <div class="max-w-2xl mx-auto">
            <h2 class="text-center text-3xl md:text-5xl font-bold text-red-600 uppercase font-oswald mb-6">Join the Club</h2>
            <form id="subscribeForm" class="bg-zinc-800 p-6 md:p-8 rounded-2xl border border-zinc-700 shadow-2xl">
                <div class="mb-3">
                    <label class="form-label text-red-500 fw-bold">Full Name</label>
                    <input type="text" class="form-control bg-zinc-900 border-zinc-700 text-white" placeholder="Enter your full name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-red-500 fw-bold">Campus Location</label>
                    <select class="form-select bg-zinc-900 border-zinc-700 text-white" required>
                        <option value="" selected disabled>Choose your campus...</option>
                        <option value="BAC">Botswana Accountancy College (BAC)</option>
                        <option value="UB">University of Botswana (UB)</option>
                        <option value="IDM">Institute of Development Management (IDM)</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="form-label text-red-500 fw-bold">Select Monthly Plan</label>
                    <div class="space-y-2">
                        <div class="form-check p-3 bg-zinc-900 border border-zinc-700 rounded">
                            <input class="form-check-input ms-0 me-3" type="radio" name="plan" id="p1" value="500" required>
                            <label class="form-check-label text-sm" for="p1">P500 Plan — 5 Days/Week</label>
                        </div>
                        <div class="form-check p-3 bg-zinc-900 border border-zinc-700 rounded">
                            <input class="form-check-input ms-0 me-3" type="radio" name="plan" id="p2" value="550">
                            <label class="form-check-label text-sm" for="p2">P550 Plan — 6 Days/Week</label>
                        </div>
                        <div class="form-check p-3 bg-zinc-900 border border-zinc-700 rounded">
                            <input class="form-check-input ms-0 me-3" type="radio" name="plan" id="p3" value="600">
                            <label class="form-check-label text-sm" for="p3">P600 Plan — 7 Days/Week</label>
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn btn-danger w-full py-3 fw-bold uppercase shadow-lg">Confirm Subscription</button>
            </form>
        </div>
    </main>

    <footer class="bg-black py-10 text-center text-zinc-500 mt-10">
        <p class="mb-2 uppercase tracking-widest font-bold text-zinc-400">© 2026 SKEIF BOTSOGO | Feeding Minds</p>
        <p>Gaborone, Botswana</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
